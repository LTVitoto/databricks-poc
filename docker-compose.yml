services:
  postgres-sap:
    image: postgres:15-alpine
    container_name: sap_simulator
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=sapadmin
      - POSTGRES_PASSWORD=sappassword
      - POSTGRES_DB=sapdb
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  minio-landing:
    image: minio/minio
    container_name: minio_landing
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      # Host corre cgroup v2 (WSL2); el JRE Zulu 11 embebido tiene un bug (NPE en
      # CgroupV2Subsystem) al leer metricas de contenedor para el agente JMX local,
      # lo que mata la JVM al arrancar. Se desactiva la deteccion de contenedor.
      KAFKA_OPTS: "-XX:-UseContainerSupport"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -qi Mode"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OPTS: "-XX:-UseContainerSupport"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 10 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  debezium-connect:
    image: quay.io/debezium/connect:2.4
    container_name: debezium_connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres-sap:
        condition: service_started
      minio-landing:
        condition: service_started
    ports:
      - "8083:8083"
    volumes:
      # Plugin S3 Sink (Confluent Hub) no viene preinstalado en la imagen base;
      # se descarga una vez a ./connect-plugins y se monta en el plugin.path del worker.
      - ./connect-plugins:/kafka/connect/kafka-connect-s3:ro
    environment:
      - BOOTSTRAP_SERVERS=kafka:29092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=connect_configs
      - OFFSET_STORAGE_TOPIC=connect_offsets
      - STATUS_STORAGE_TOPIC=connect_statuses
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - KAFKA_OPTS=-XX:-UseContainerSupport

  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: bridge_sync
    depends_on:
      - minio-landing
    environment:
      - MINIO_ENDPOINT=http://minio-landing:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=landing-zone
      - MINIO_PREFIX=
      - DATABRICKS_VOLUME_ROOT=dbfs:/Volumes/mi_test_catalogo/default/paquet_demo
      - DATABRICKS_CLI_PROFILE=DEFAULT
      - SYNC_POLL_INTERVAL=10
      - SYNC_STATE_FILE=/app/state/.sync_state.json
    volumes:
      # Reusa la autenticacion del Databricks CLI ya configurada en el host
      # (perfil DEFAULT); no se generan ni hornean credenciales en la imagen.
      - ${HOME}/.databrickscfg:/root/.databrickscfg:ro
      - ./bridge-state:/app/state
    restart: unless-stopped

  edicom-simulator:
    build:
      context: .
      dockerfile: Dockerfile.edicom
    container_name: edicom_simulator
    depends_on:
      - minio-landing
    environment:
      - MINIO_ENDPOINT=http://minio-landing:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=landing-zone
      - MINIO_PREFIX=edicom/sellout
      - EDICOM_BACKFILL_DAYS=30
      - SIMULATION_INTERVAL_SECONDS=60
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: cfo_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: cfo_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped